<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Equipment Loan System</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <h1>Lab Equipment Loan System</h1>
    <div class="topbar-controls">
      <label for="input-time">Current time (min)</label>
      <input id="input-time" type="number" min="0" value="0">
      <button id="btn-load-sample" data-action="load-sample">Load sample data</button>
    </div>
  </header>

  <div id="error-banner" class="error-banner hidden"></div>

  <nav class="tabs" id="tabs"></nav>

  <div class="content">
    <main class="screen" id="screen"></main>
    <aside class="sidebar" id="sidebar"></aside>
  </div>
</div>

<script type="module" src="./dist/bundle.js"></script>
</body>
</html>
